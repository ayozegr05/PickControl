name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'Frontend/PickControl/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Frontend/PickControl/**'
      - '.github/workflows/frontend.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/PickControl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/PickControl/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check . --ignore-path .prettierignore

      - name: ESLint check
        run: npx eslint . --ext .ts,.tsx,.js

      - name: TypeScript check
        run: npx tsc --noEmit
