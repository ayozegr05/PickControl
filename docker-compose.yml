services:
  db:
    image: postgres:16-alpine
    container_name: controlpick-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controlpick
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controlpick"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controlpick-backend
    env_file:
      - ./backend/.env
    environment:
      # Sobreescribe la URL del .env para apuntar al contenedor de PostgreSQL.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/controlpick
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persistir sesión de Telegram y las imágenes descargadas entre reinicios.
      - ./backend/controlpick_telegram.session:/app/controlpick_telegram.session
      - ./backend/media:/app/media
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
