services:
  - type: web
    name: my-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run dev
    branch: main
    envVars:
      # El valor real se configura manualmente en el dashboard de Render
      # (Environment > Secret), nunca en este archivo versionado.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

